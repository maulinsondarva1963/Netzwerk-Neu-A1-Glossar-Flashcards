<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German A1 Flashcards - Chapter 1</title>
    <!-- We load Tailwind CSS directly from the web for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS for the 3D flipping effect */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-preserve-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header / Stats -->
    <div class="mb-8 text-center">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Kapitel 1: Guten Tag!</h1>
        <p class="text-gray-600">Card <span id="current-index">1</span> of <span id="total-cards">0</span></p>
    </div>

    <!-- Flashcard Container -->
    <div class="w-full max-w-md perspective-1000" onclick="flipCard()">
        <div id="flashcard-inner" class="relative w-full h-96 transition-transform duration-500 transform-style-preserve-3d cursor-pointer shadow-xl rounded-2xl">
            
            <!-- Front of Card (German) -->
            <div class="absolute inset-0 flex flex-col items-center justify-center p-6 bg-white rounded-2xl backface-hidden border border-gray-200">
                <span id="card-difficulty" class="absolute top-4 right-4 text-xs font-bold uppercase tracking-wider text-gray-400">LOW</span>
                <button onclick="playAudio(event)" class="absolute top-4 left-4 p-2 bg-blue-100 rounded-full hover:bg-blue-200 transition text-xl">
                    🔊
                </button>
                
                <p id="card-pos" class="text-sm text-gray-500 italic mb-2">Noun</p>
                <h2 class="text-4xl font-bold text-gray-900">
                    <span id="card-article" class="text-blue-500 font-normal mr-2">das</span>
                    <span id="card-word">Wort</span>
                </h2>
                <p class="text-sm text-gray-400 mt-8">(Click to flip)</p>
            </div>

            <!-- Back of Card (English) -->
            <div class="absolute inset-0 flex flex-col items-center justify-center p-6 bg-blue-50 rounded-2xl backface-hidden rotate-y-180 border border-blue-200">
                <h2 id="card-translation" class="text-3xl font-bold text-gray-900 mb-6 text-center">
                    word
                </h2>
                <div class="text-center">
                    <p id="card-ex-de" class="text-lg text-gray-800 font-medium mb-2">
                        "Beispiel"
                    </p>
                    <p id="card-ex-en" class="text-sm text-gray-500 italic">
                        "Example"
                    </p>
                </div>
            </div>

        </div>
    </div>

    <!-- Navigation Buttons -->
    <div class="flex gap-4 mt-8">
        <button onclick="prevCard()" class="px-6 py-3 bg-white text-gray-700 font-semibold rounded-xl hover:bg-gray-50 transition shadow">
            &larr; Previous
        </button>
        <button onclick="nextCard()" class="px-6 py-3 bg-blue-500 text-white font-semibold rounded-xl hover:bg-blue-600 transition shadow-lg shadow-blue-500/30">
            Next &rarr;
        </button>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // The Chapter 1 Vocabulary Data
        const vocabulary = [
            { word: "Bulgarisch", article: "das", partOfSpeech: "Noun", translation: "Bulgarian", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "Deutsch", article: "das", partOfSpeech: "Noun", translation: "German", exampleSentence: "Ich spreche Deutsch.", exampleTranslation: "I speak German.", difficultyLevel: "LOW" },
            { word: "Englisch", article: "das", partOfSpeech: "Noun", translation: "English", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "gut", article: null, partOfSpeech: "Adjective", translation: "good", exampleSentence: "Guten Tag!", exampleTranslation: "Good day!", difficultyLevel: "LOW" },
            { word: "guten Tag", article: null, partOfSpeech: "Phrase", translation: "Good day! Hello!", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "Indonesisch", article: "das", partOfSpeech: "Noun", translation: "Indonesian", exampleSentence: "", exampleTranslation: "", difficultyLevel: "MEDIUM" },
            { word: "international", article: null, partOfSpeech: "Adjective", translation: "international", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "Italienisch", article: "das", partOfSpeech: "Noun", translation: "Italian", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "Japanisch", article: "das", partOfSpeech: "Noun", translation: "Japanese", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "Russisch", article: "das", partOfSpeech: "Noun", translation: "Russian", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "Serbisch", article: "das", partOfSpeech: "Noun", translation: "Serbian", exampleSentence: "", exampleTranslation: "", difficultyLevel: "MEDIUM" },
            { word: "Sie", article: null, partOfSpeech: "Pronoun", translation: "you (formal)", exampleSentence: "Ordnen Sie zu.", exampleTranslation: "Match.", difficultyLevel: "LOW" },
            { word: "Türkisch", article: "das", partOfSpeech: "Noun", translation: "Turkish", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "Ungarisch", article: "das", partOfSpeech: "Noun", translation: "Hungarian", exampleSentence: "", exampleTranslation: "", difficultyLevel: "MEDIUM" },
            { word: "was", article: null, partOfSpeech: "Pronoun", translation: "what?", exampleSentence: "Was ist das?", exampleTranslation: "What is that?", difficultyLevel: "LOW" },
            { word: "zuordnen", article: null, partOfSpeech: "Verb", translation: "to assign, to match", exampleSentence: "", exampleTranslation: "", difficultyLevel: "MEDIUM" },
            { word: "zusammengehören", article: null, partOfSpeech: "Verb", translation: "to fit together", exampleSentence: "", exampleTranslation: "", difficultyLevel: "HIGH" },
            { word: "Autobahn", article: "die", partOfSpeech: "Noun", translation: "highway", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "Butterbrot", article: "das", partOfSpeech: "Noun", translation: "sandwich", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "Flasche", article: "die", partOfSpeech: "Noun", translation: "bottle", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "Handtuch", article: "das", partOfSpeech: "Noun", translation: "towel", exampleSentence: "", exampleTranslation: "", difficultyLevel: "MEDIUM" },
            { word: "Kindergarten", article: "der", partOfSpeech: "Noun", translation: "kindergarten", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "Koffer", article: "der", partOfSpeech: "Noun", translation: "suitcase", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "Kranke", article: "der/die", partOfSpeech: "Noun", translation: "sick person", exampleSentence: "", exampleTranslation: "", difficultyLevel: "MEDIUM" },
            { word: "Nudel", article: "die", partOfSpeech: "Noun", translation: "noodle", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "Würstchen", article: "das", partOfSpeech: "Noun", translation: "sausage", exampleSentence: "\"Würstchen\" heißt auf Italienisch \"wurstel\".", exampleTranslation: "\"Sausage\" in Italian is called \"wurstel\".", difficultyLevel: "LOW" },
            { word: "auf", article: null, partOfSpeech: "Preposition", translation: "in", exampleSentence: "\"Würstchen\" heißt auf Italienisch \"wurstel\".", exampleTranslation: "\"Sausage\" in Italian is called \"wurstel\".", difficultyLevel: "MEDIUM" },
            { word: "heißen", article: null, partOfSpeech: "Verb", translation: "to be called", exampleSentence: "Ich heiße Niklas.", exampleTranslation: "My name is Niklas.", difficultyLevel: "LOW" },
            { word: "Ihr / Ihre", article: null, partOfSpeech: "Pronoun", translation: "your (formal)", exampleSentence: "Wie heißen die Wörter in Ihrer Sprache?", exampleTranslation: "What are the words called in your language?", difficultyLevel: "MEDIUM" },
            { word: "in", article: null, partOfSpeech: "Preposition", translation: "in", exampleSentence: "Wie heißen die Wörter in Ihrer Sprache?", exampleTranslation: "What are the words called in your language?", difficultyLevel: "LOW" },
            { word: "Spanisch", article: "das", partOfSpeech: "Noun", translation: "Spanish", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "Sprache", article: "die", partOfSpeech: "Noun", translation: "language", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "wie", article: null, partOfSpeech: "Pronoun", translation: "how / what", exampleSentence: "Wie heißen die Wörter in Ihrer Sprache?", exampleTranslation: "What are the words called in your language?", difficultyLevel: "LOW" },
            { word: "Wort", article: "das", partOfSpeech: "Noun", translation: "word", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "andere", article: null, partOfSpeech: "Adjective", translation: "other", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "deutsch", article: null, partOfSpeech: "Adjective", translation: "German", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "ein / eine", article: null, partOfSpeech: "Article", translation: "a / an", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" },
            { word: "kennen", article: null, partOfSpeech: "Verb", translation: "to know", exampleSentence: "", exampleTranslation: "", difficultyLevel: "MEDIUM" },
            { word: "Kursplakat", article: "das", partOfSpeech: "Noun", translation: "course poster", exampleSentence: "", exampleTranslation: "", difficultyLevel: "MEDIUM" },
            { word: "machen", article: null, partOfSpeech: "Verb", translation: "to make", exampleSentence: "Machen Sie ein Kursplakat.", exampleTranslation: "Make a course poster.", difficultyLevel: "LOW" },
            { word: "sammeln", article: null, partOfSpeech: "Verb", translation: "to collect", exampleSentence: "", exampleTranslation: "", difficultyLevel: "MEDIUM" },
            { word: "und", article: null, partOfSpeech: "Conjunction", translation: "and", exampleSentence: "", exampleTranslation: "", difficultyLevel: "LOW" }
        ];

        let currentIndex = 0;
        let isFlipped = false;

        // Elements
        const flashcardInner = document.getElementById('flashcard-inner');
        const cardDifficulty = document.getElementById('card-difficulty');
        const cardPos = document.getElementById('card-pos');
        const cardArticle = document.getElementById('card-article');
        const cardWord = document.getElementById('card-word');
        const cardTranslation = document.getElementById('card-translation');
        const cardExDe = document.getElementById('card-ex-de');
        const cardExEn = document.getElementById('card-ex-en');
        const currentIndexDisplay = document.getElementById('current-index');
        const totalCardsDisplay = document.getElementById('total-cards');

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            totalCardsDisplay.innerText = vocabulary.length;
            loadCard(currentIndex);
        });

        // Load specific card
        function loadCard(index) {
            const card = vocabulary[index];
            
            // Update Text
            cardDifficulty.innerText = card.difficultyLevel;
            cardPos.innerText = card.partOfSpeech;
            
            if (card.article) {
                cardArticle.innerText = card.article;
                cardArticle.style.display = 'inline';
            } else {
                cardArticle.style.display = 'none';
            }

            cardWord.innerText = card.word;
            cardTranslation.innerText = card.translation;
            
            if (card.exampleSentence) {
                cardExDe.innerText = `"${card.exampleSentence}"`;
                cardExEn.innerText = `"${card.exampleTranslation}"`;
                cardExDe.style.display = 'block';
                cardExEn.style.display = 'block';
            } else {
                cardExDe.style.display = 'none';
                cardExEn.style.display = 'none';
            }

            // Update Counter
            currentIndexDisplay.innerText = index + 1;
        }

        // Flip Card Logic
        function flipCard() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                flashcardInner.classList.add('rotate-y-180');
            } else {
                flashcardInner.classList.remove('rotate-y-180');
            }
        }

        // Next Card Logic
        function nextCard() {
            if (isFlipped) flipCard(); // Unflip before changing
            
            setTimeout(() => {
                currentIndex++;
                if (currentIndex >= vocabulary.length) currentIndex = 0; // Loop back to start
                loadCard(currentIndex);
            }, isFlipped ? 300 : 0); // Wait for unflip animation if needed
        }

        // Previous Card Logic
        function prevCard() {
            if (isFlipped) flipCard(); // Unflip before changing
            
            setTimeout(() => {
                currentIndex--;
                if (currentIndex < 0) currentIndex = vocabulary.length - 1; // Loop back to end
                loadCard(currentIndex);
            }, isFlipped ? 300 : 0);
        }

        // Audio Pronunciation
        function playAudio(event) {
            event.stopPropagation(); // Stop the card from flipping when clicking the button
            const word = vocabulary[currentIndex].word;
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'de-DE'; // German language code
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
